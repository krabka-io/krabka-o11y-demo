[workspace]
resolver = "2"
members = ["crates/*"]
# The cargo-mutants pin that Bazel builds //tools/mutants from is not a member.
exclude = ["tools/mutants"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
authors = ["The Krabka Authors"]
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These three opt-outs are intentional while the public API is still pre-1.0;
# re-evaluate once API surfaces stabilise.
clone_on_copy = "warn"

[profile.mutants]
inherits = "test"
debug = "none"

[profile.dev]
# Split debug info into a separate file (reduces linker work)
split-debuginfo = "packed"

[workspace.dependencies]
# Expressive test assertions: `assert!(a == b)` / `check!(..)` with
# captured-expression diagnostics. Used for all test assertions workspace-wide.
assert2 = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
prometheus-client = "0.25"
prost = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
# Pure-Rust protobuf compiler — lets crates that drive `prost-build` directly
# generate code without a `protoc` binary. The Connect crates still need a
# binary (connectrpc-axum-build always shells out to protoc), so they use the
# vendored one below.
protox = "0.10"
refined_type = "0.6"
tokio = { version = "1", default-features = false }
# Dev-only, for driving an axum Router in-process without binding a socket.
tower = { version = "0.5", default-features = false }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
serde_yaml = "0.9"
serde_json = "1"

# First-party crates inherited by more than one member.
krabka-units = "0.6.0"

# Sibling repositories, pinned by revision. These crates are declared
# against crates.io above and in the member manifests; the patch below is
# the single place a sibling revision is bumped.
#
# Every crate each sibling publishes is listed, not only the ones this
# repo names directly: cargo ignores a dependency's own patch table, so a
# crate reached transitively would otherwise come from the registry while
# its git twin is also in the graph.
[patch.crates-io]
# krabka-streams-rs used to vendor its own `krabka-schema-serde`; that member
# is gone, and the crate now comes from krabka-schema-registry, which is the
# copy krabka-client-streams itself resolves.
krabka-admin-ui = { git = "https://github.com/krabka-io/krabka-cli", rev = "91d4b370a3cf7e54808c1b0aa70d11fdd21bf45c" }

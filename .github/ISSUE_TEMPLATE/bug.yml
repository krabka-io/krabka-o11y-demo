name: Bug report
description: Report a reproducible problem in the demo or its tooling
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include OS, architecture, Docker version, and image digests.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Add relevant logs, traces, metrics, or profile query output.

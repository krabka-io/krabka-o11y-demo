krabka-client-streams = { git = "https://github.com/krabka-io/krabka-streams-rs", rev = "0054480" }
# krabka-streams-rs used to vendor its own `krabka-schema-serde`; that member
# is gone, and the crate now comes from krabka-schema-registry, which is the
# copy krabka-client-streams itself resolves.
krabka-schema-serde = { git = "https://github.com/krabka-io/krabka-schema-registry", rev = "ee9c3933fb1d71735846e7e5e33ea6ab3a694dc5" }

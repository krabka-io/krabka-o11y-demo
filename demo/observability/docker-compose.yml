name: krabka-observability-demo

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
  AWS_ENDPOINT_URL: http://rustfs:9000
  AWS_ALLOW_HTTP: "true"
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"

x-otlp-env: &otlp-env
  RUST_LOG: "${KRABKA_RUST_LOG:-info,pprof::profiler=warn,object_store::client::retry=warn}"
  KRABKA_OTLP_ENDPOINT: http://alloy:4317
  # Head sampling ratio. Every Krabka service self-instruments at 100% by
  # default, and the traces pipeline (distributor/broker/block-builder) traces
  # its OWN span-ingest operations — those spans get exported back through Alloy
  # into the traces WAL, which traces THAT ingest, and so on. At ratio 1.0 the
  # loop diverges (observed: 62M+ spans, a 250MB+ trace index the querier cannot
  # serve). 0.05 keeps the per-generation amplification < 1 so the feedback
  # converges while still leaving plenty of demo traces to view.
  KRABKA_OTLP_SAMPLE_RATIO: "0.05"
  KRABKA_OTLP_HEARTBEAT_INTERVAL: "${KRABKA_OTLP_HEARTBEAT_INTERVAL:-15s}"
  KRABKA_ADMIN_LISTEN_ADDR: 0.0.0.0:9404
  # The workload image predates the repository's namespace rename. Keep its
  # old environment spelling until that image is republished.
  CRABKA_OTLP_ENDPOINT: http://alloy:4317
  CRABKA_OTLP_SAMPLE_RATIO: "0.05"
  CRABKA_OTLP_HEARTBEAT_INTERVAL: "15s"
  CRABKA_ADMIN_LISTEN_ADDR: 0.0.0.0:9404
  # Enable jemalloc heap profiling support continuously so heap profiles include
  # long-lived allocations, but sample coarsely (~every 1 MiB) so small demo
  # services still produce useful heap profiles without tracing every
  # allocation. NOT
  # lg_prof_sample:0, which backtraces every allocation.
  # Short dirty/muzzy decay plus the jemalloc background thread keeps inactive
  # heap-profile and query allocations from sitting in RSS indefinitely.
  MALLOC_CONF: "prof:true,prof_active:true,lg_prof_sample:20,background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000"

# Every Krabka service runs the same all-in-one demo image. By default this
# PULLS the prebuilt image from GHCR (published by the publish-demo-image
# workflow) so `docker compose up` needs no local build. To run from source
# instead, build an apko image from the repo root and docker-load/tag it under
# the same name:
#   melange keygen melange.rsa
#   melange build packaging/melange/krabka-demo.yaml --source-dir . --signing-key melange.rsa --arch x86_64 --runner docker --cache-dir "$PWD/.melange-cache" --out-dir packages/
#   apko build packaging/apko/krabka-demo.yaml ghcr.io/robot-head/crabka-demo:latest krabka-demo.tar --arch x86_64 --repository-append "$PWD/packages" --keyring-append "$PWD/melange.rsa.pub"
#   docker load < krabka-demo.tar
# then `docker compose up -d` (Compose uses the local image when present).
x-krabka-image: &krabka-image
  image: ghcr.io/robot-head/crabka-demo:latest
  restart: unless-stopped

x-broker-image: &broker-image
  image: ${KRABKA_BROKER_IMAGE:-ghcr.io/krabka-io/krabka-broker@sha256:15851611a7d5df6e20d3f9bd85b3821ca2dd52d5ca6f4042f5a4cfe0a3a1ab89}
  restart: unless-stopped

x-o11y-image: &o11y-image
  image: ${KRABKA_O11Y_IMAGE:-ghcr.io/krabka-io/krabka-o11y@sha256:ca487a67550d11efa3d7ad00b1a65ff1ab6c4d92844665a61a1ea991be83e3e8}
  restart: unless-stopped

x-legacy-demo-env: &legacy-demo-env
  CRABKA_DEMO_BOOTSTRAP: broker:9092
  CRABKA_DEMO_REGISTRY: http://schema-registry:8081

# ---------------------------------------------------------------------------
# Per-tier resource limits (hard caps; memswap_limit == mem_limit so a tier that
# exceeds its cap is OOM-killed + restarted rather than swap-thrashing). Defaults
# target a ~16 GB / 8-core dev machine (steady-state usage is ~8-9 GiB; a ~12 GiB
# host is the practical floor). Every value is overridable via .env, so the SAME
# compose scales from a laptop to a large server — see .env for the per-tier
# knobs, the small-host path (the distributors carry a fixed ~1.5-1.7 GiB
# heap-profiling RSS floor, so the real small-host lever is disabling prof, NOT
# shrinking their cap), and how the workload knob couples to the distributor /
# compactor caps. Caps may sum above host RAM (real usage is far lower); a `cpus`
# above the host core count is simply non-binding.
# ---------------------------------------------------------------------------
x-broker-res: &broker-res
  mem_limit: ${KRABKA_BROKER_MEM:-2g}
  memswap_limit: ${KRABKA_BROKER_MEM:-2g}
  cpus: ${KRABKA_BROKER_CPUS:-4}
x-distributor-res: &distributor-res
  mem_limit: ${KRABKA_DISTRIBUTOR_MEM:-3g}
  memswap_limit: ${KRABKA_DISTRIBUTOR_MEM:-3g}
  cpus: ${KRABKA_DISTRIBUTOR_CPUS:-2}
x-querier-res: &querier-res
  mem_limit: ${KRABKA_QUERIER_MEM:-2g}
  memswap_limit: ${KRABKA_QUERIER_MEM:-2g}
  cpus: ${KRABKA_QUERIER_CPUS:-2}
x-compactor-res: &compactor-res
  mem_limit: ${KRABKA_COMPACTOR_MEM:-1g}
  memswap_limit: ${KRABKA_COMPACTOR_MEM:-1g}
  cpus: ${KRABKA_COMPACTOR_CPUS:-2}
x-registry-res: &registry-res
  mem_limit: ${KRABKA_SCHEMA_REGISTRY_MEM:-768m}
  memswap_limit: ${KRABKA_SCHEMA_REGISTRY_MEM:-768m}
  cpus: ${KRABKA_SCHEMA_REGISTRY_CPUS:-1}
x-rustfs-res: &rustfs-res
  mem_limit: ${KRABKA_RUSTFS_MEM:-2g}
  memswap_limit: ${KRABKA_RUSTFS_MEM:-2g}
  cpus: ${KRABKA_RUSTFS_CPUS:-2}
x-alloy-res: &alloy-res
  mem_limit: ${KRABKA_ALLOY_MEM:-512m}
  memswap_limit: ${KRABKA_ALLOY_MEM:-512m}
  cpus: ${KRABKA_ALLOY_CPUS:-1}
x-cadvisor-res: &cadvisor-res
  mem_limit: ${KRABKA_CADVISOR_MEM:-512m}
  memswap_limit: ${KRABKA_CADVISOR_MEM:-512m}
  cpus: ${KRABKA_CADVISOR_CPUS:-1}
x-grafana-res: &grafana-res
  mem_limit: ${KRABKA_GRAFANA_MEM:-1g}
  memswap_limit: ${KRABKA_GRAFANA_MEM:-1g}
  cpus: ${KRABKA_GRAFANA_CPUS:-2}
x-demo-res: &demo-res
  mem_limit: ${KRABKA_DEMO_MEM:-1g}
  memswap_limit: ${KRABKA_DEMO_MEM:-1g}
  cpus: ${KRABKA_DEMO_CPUS:-1}
x-gres-res: &gres-res
  mem_limit: ${KRABKA_GRES_MEM:-1g}
  memswap_limit: ${KRABKA_GRES_MEM:-1g}
  cpus: ${KRABKA_GRES_CPUS:-2}
x-setup-res: &setup-res
  mem_limit: ${KRABKA_SETUP_MEM:-512m}
  memswap_limit: ${KRABKA_SETUP_MEM:-512m}
  cpus: ${KRABKA_SETUP_CPUS:-1}

services:
  # One-shot: format the broker's KRaft storage (writes meta.properties.json)
  # before the broker starts. Idempotent — skips if already formatted. The
  # controller listener is advertised-host:9093 (broker.rs derives it from
  # --advertised-listener with port 9093).
  # --feature streams.version=1 finalizes the KIP-1071 feature gate so that
  # demo-stream (Kafka Streams group coordinator) starts successfully. If you
  # already have a broker-data volume from before this flag was added, wipe it
  # with `docker compose down -v` and restart.
  broker-permissions:
    image: mirror.gcr.io/library/busybox:1.38
    <<: *setup-res
    restart: "no"
    command: ["chown", "65532:65532", "/data"]
    volumes: ["broker-data:/data"]

  broker-format:
    image: ${KRABKA_BROKER_IMAGE:-ghcr.io/krabka-io/krabka-broker@sha256:15851611a7d5df6e20d3f9bd85b3821ca2dd52d5ca6f4042f5a4cfe0a3a1ab89}
    <<: *setup-res
    restart: "no"
    entrypoint: ["/usr/bin/krabka-format"]
    command: ["--log-dir=/data", "--standalone", "--node-id=1", "--controller-listener=broker:9093", "--feature=streams.version=1", "--ignore-formatted"]
    volumes: ["broker-data:/data"]
    depends_on:
      broker-permissions:
        condition: service_completed_successfully

  broker:
    <<: [*broker-image, *broker-res]
    command: ["--listen-addr=0.0.0.0:9092", "--advertised-listener=broker:9092", "--log-dir=/data", "--process-roles=controller,broker"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: broker
      KRABKA_METRICS_LISTEN_ADDR: 0.0.0.0:9404
    ports: ["9092:9092", "9404:9404"]
    volumes: ["broker-data:/data"]
    depends_on:
      broker-format:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/krabka-guard", "--bootstrap-server", "127.0.0.1:9092", "freeze", "list"]
      interval: 5s
      timeout: 3s
      retries: 30

  rustfs-permissions:
    image: mirror.gcr.io/library/busybox:1.38
    <<: *setup-res
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes: ["rustfs-data:/data"]

  rustfs:
    image: mirror.gcr.io/rustfs/rustfs:latest
    restart: unless-stopped
    # Resource caps (see x-rustfs-res / .env); the cap bounds object-store cache and query bursts.
    <<: *rustfs-res
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_OBS_ENDPOINT: http://alloy:4318
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "true"
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: "true"
      # RustFS treats non-production environments as local development and
      # prints full tracing span lifecycle events to stdout. That makes traces
      # easy to spot, but overwhelms the demo logs/query path. Keep local stdout
      # quiet and export RustFS telemetry through OTLP instead.
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_SAMPLE_RATIO: "0.05"
      RUSTFS_OBS_SERVICE_NAME: rustfs
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_METER_INTERVAL: "15"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "false"
      # This fixture stores many small parquet/json blocks and must stay inside
      # a laptop-friendly memory cap. Keep adaptive sizing enabled, but use the
      # small-object profile instead of GeneralPurpose's 1 MiB unknown-size
      # buffers.
      RUSTFS_BUFFER_PROFILE: WebWorkload
      RUSTFS_OBJECT_IO_STORAGE_MEDIA_OVERRIDE: hdd
      RUSTFS_ALLOCATOR_RECLAIM_ENABLED: "true"
      RUSTFS_ALLOCATOR_RECLAIM_INTERVAL_SECS: "15"
      RUSTFS_ALLOCATOR_RECLAIM_IDLE_INTERVALS: "1"
      RUSTFS_OBJECT_FILE_CACHE_RECLAIM_READ_ENABLE: "true"
      RUSTFS_OBJECT_FILE_CACHE_RECLAIM_WRITE_ENABLE: "true"
      RUSTFS_OBJECT_FILE_CACHE_RECLAIM_THRESHOLD: "65536"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rustfs-data:/data"]
    depends_on:
      rustfs-permissions: {condition: service_completed_successfully}
      alloy: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  rustfs-setup:
    image: mirror.gcr.io/amazon/aws-cli:latest
    <<: *setup-res
    environment: {<<: *s3-env}
    depends_on:
      rustfs: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes: ["./rustfs/bootstrap.sh:/bootstrap.sh:ro"]

  observability-topic-setup:
    <<: [*o11y-image, *setup-res]
    restart: "no"
    command: ["krabka-o11y-bootstrap", "--bootstrap=broker:9092"]
    depends_on:
      broker: {condition: service_healthy}

  # One-shot: pre-create the demo order topics. The published observability
  # bootstrap above creates and validates its four WAL and two compacted state
  # topics against the pinned broker.
  topic-setup:
    image: mirror.gcr.io/apache/kafka:4.3.1
    <<: *setup-res
    restart: "no"
    depends_on:
      observability-topic-setup: {condition: service_completed_successfully}
    entrypoint:
      - /bin/sh
      - -c
      - >
        for t in orders order-counts; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:9092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1 || exit 1; done; echo "topics ready" #magic___^_^___line
  schema-registry:
    <<: [*krabka-image, *registry-res]
    command: ["crabka-schema-registry", "--bootstrap-servers=broker:9092", "--listen-addr=0.0.0.0:8081", "--schemas-topic-rf=1"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: schema-registry
    depends_on:
      broker: {condition: service_healthy}
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # ---- METRICS (Prometheus/Mimir) ----
  metrics-distributor:
    # krabka-metrics uses --bootstrap (not --wal-bootstrap); the distributor
    # writes to the WAL (Kafka), not the object store, so no --object-store-url.
    <<: [*o11y-image, *distributor-res]
    command: ["krabka-metrics", "--target=distributor", "--listen=0.0.0.0:4041", "--bootstrap=broker:9092"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: metrics-distributor
    depends_on:
      broker: {condition: service_healthy}

  metrics-compactor:
    <<: [*o11y-image, *compactor-res]
    command: ["krabka-metrics", "--target=compactor", "--object-store-url=s3://krabka-metrics", "--bootstrap=broker:9092", "--compactor-retention=${KRABKA_METRICS_COMPACTOR_RETENTION:-1h}", "--compactor-retention-sweep-interval=${KRABKA_METRICS_COMPACTOR_RETENTION_SWEEP_INTERVAL:-30s}"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: metrics-compactor
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}
      broker: {condition: service_healthy}

  metrics-querier:
    # krabka-metrics-service uses --wal-bootstrap (its own flag name).
    <<: [*o11y-image, *querier-res]
    command: ["krabka-metrics-service", "--target=querier", "--listen=0.0.0.0:9090", "--object-store-url=s3://krabka-metrics", "--manifest-prefix=metrics", "--wal-bootstrap=broker:9092", "--wal-head-retention=${KRABKA_METRICS_QUERIER_WAL_HEAD_RETENTION:-5m}"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: metrics-querier
    ports: ["9090:9090"]
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}
      broker: {condition: service_healthy}

  # ---- TRACES (Tempo) ----
  traces-distributor:
    <<: [*o11y-image, *distributor-res]
    command: ["krabka-traces", "--target=distributor", "--bootstrap=broker:9092", "--listen=0.0.0.0:3200", "--grpc-listen=0.0.0.0:4317", "--otlp-http-listen=0.0.0.0:4318"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: traces-distributor
    depends_on:
      broker: {condition: service_healthy}

  traces-block-builder:
    <<: [*o11y-image, *compactor-res]
    mem_limit: ${KRABKA_TRACES_BLOCK_BUILDER_MEM:-4g}
    memswap_limit: ${KRABKA_TRACES_BLOCK_BUILDER_MEM:-4g}
    command: ["krabka-traces", "--target=block-builder", "--bootstrap=broker:9092", "--object-store-url=s3://krabka-traces", "--block-builder-flush-max-records=${KRABKA_TRACES_BLOCK_BUILDER_FLUSH_MAX_RECORDS:-50000}", "--block-builder-flush-max-age-ms=${KRABKA_TRACES_BLOCK_BUILDER_FLUSH_MAX_AGE_MS:-60000}"]
    environment:
      <<: [*s3-env, *otlp-env]
      KRABKA_TRACES_INDEX_SNAPSHOT_MAX: "${KRABKA_TRACES_INDEX_SNAPSHOT_MAX:-256MiB}"
      KRABKA_TRACES_INDEX_SNAPSHOT_RETAIN: "${KRABKA_TRACES_INDEX_SNAPSHOT_RETAIN:-8}"
      KRABKA_TRACES_WAL_FETCH_MAX: "${KRABKA_TRACES_WAL_FETCH_MAX:-2MiB}"
      KRABKA_TRACES_WAL_FETCH_PARTITION_MAX: "${KRABKA_TRACES_WAL_FETCH_PARTITION_MAX:-256KiB}"
      OTEL_SERVICE_NAME: traces-block-builder
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}
      broker: {condition: service_healthy}

  traces-metrics-generator:
    <<: [*o11y-image, *compactor-res]
    command: ["krabka-traces", "--target=metrics-generator", "--bootstrap=broker:9092", "--remote-write-url=http://metrics-distributor:4041/api/v1/push", "--enable-target-info"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: traces-metrics-generator
    depends_on:
      broker: {condition: service_healthy}
      metrics-distributor: {condition: service_started}
      topic-setup: {condition: service_completed_successfully}

  traces-querier:
    <<: [*o11y-image, *querier-res]
    command: ["krabka-traces", "--target=querier", "--listen=0.0.0.0:3200", "--object-store-url=s3://krabka-traces"]
    environment:
      <<: [*s3-env, *otlp-env]
      KRABKA_TRACES_INDEX_SNAPSHOT_MAX: "${KRABKA_TRACES_INDEX_SNAPSHOT_MAX:-256MiB}"
      KRABKA_TRACES_BLOCK_READ_MAX: "${KRABKA_TRACES_BLOCK_READ_MAX:-1GiB}"
      KRABKA_TRACES_SCAN_CONCAT_MAX: "${KRABKA_TRACES_SCAN_CONCAT_MAX:-1.5GB}"
      OTEL_SERVICE_NAME: traces-querier
    ports: ["3200:3200"]
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}

  # ---- LOGS (Loki) — binary is `krabka-observability` (the logs service) ----
  logs-distributor:
    <<: [*o11y-image, *distributor-res]
    command: ["krabka-observability", "--target=distributor", "--listen-addr=0.0.0.0:3100", "--wal-bootstrap-server=broker:9092", "--object-store-url=s3://krabka-logs"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: logs-distributor
    depends_on:
      broker: {condition: service_healthy}
      rustfs-setup: {condition: service_completed_successfully}

  logs-compactor:
    <<: [*o11y-image, *compactor-res]
    command: ["krabka-observability", "--target=compactor", "--wal-bootstrap-server=broker:9092", "--object-store-url=s3://krabka-logs", "--index-prefix=logs"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: logs-compactor
    depends_on:
      broker: {condition: service_healthy}
      rustfs-setup: {condition: service_completed_successfully}

  logs-querier:
    # --wal-group-id MUST differ from the compactor's default
    # (`krabka-observability-compactor`): both subscribe() to the single-partition
    # logs WAL, so a shared group id makes them fight over the one partition and
    # the querier's consumer spins on REBALANCE_IN_PROGRESS(27). A distinct group
    # lets each independently tail the WAL.
    # --querier-index-source=tenant-object-store-shards reads the incremental
    # shard catalog the compactor writes to S3 (default `local-manifest` reads
    # the querier's empty local disk -> no labels/series). With no --tenant, the
    # tenant is resolved per-request from X-Scope-OrgID.
    <<: [*o11y-image, *querier-res]
    command: ["krabka-observability", "--target=querier", "--listen-addr=0.0.0.0:3100", "--wal-bootstrap-server=broker:9092", "--object-store-url=s3://krabka-logs", "--index-prefix=logs", "--querier-index-source=tenant-object-store-shards", "--wal-group-id=krabka-observability-querier"]
    environment:
      <<: [*s3-env, *otlp-env]
      OTEL_SERVICE_NAME: logs-querier
    ports: ["3100:3100"]
    # The hot-tail WAL consumer (--wal-bootstrap-server) connects to the broker at
    # startup; without waiting for broker health it starts too early, the initial
    # consumer-group join fails, and the tail never recovers -> empty labels/streams
    # until the container is restarted. Wait for the broker like the compactor does.
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}
      broker: {condition: service_healthy}

  # ---- PROFILES (Pyroscope) ----
  profiles-distributor:
    <<: [*o11y-image, *distributor-res]
    command: ["krabka-profiles", "--target=distributor", "--listen=0.0.0.0:4040", "--bootstrap=broker:9092"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: profiles-distributor
    depends_on:
      broker: {condition: service_healthy}

  profiles-block-builder:
    <<: [*o11y-image, *compactor-res]
    command: ["krabka-profiles", "--target=block-builder", "--bootstrap=broker:9092", "--object-store-url=s3://krabka-profiles", "--block-builder-flush-records=${KRABKA_PROFILES_BLOCK_BUILDER_FLUSH_RECORDS:-4096}", "--block-builder-flush-max-age-ms=${KRABKA_PROFILES_BLOCK_BUILDER_FLUSH_MAX_AGE_MS:-60000}"]
    environment:
      <<: [*s3-env, *otlp-env]
      KRABKA_PROFILES_INDEX_SNAPSHOT_MAX: "${KRABKA_PROFILES_INDEX_SNAPSHOT_MAX:-256MiB}"
      KRABKA_PROFILES_INDEX_SNAPSHOT_RETAIN: "${KRABKA_PROFILES_INDEX_SNAPSHOT_RETAIN:-8}"
      KRABKA_PROFILES_WAL_FETCH_MAX: "${KRABKA_PROFILES_WAL_FETCH_MAX:-2MiB}"
      KRABKA_PROFILES_WAL_FETCH_PARTITION_MAX: "${KRABKA_PROFILES_WAL_FETCH_PARTITION_MAX:-256KiB}"
      KRABKA_PROFILES_WAL_POLL_TIMEOUT: "${KRABKA_PROFILES_WAL_POLL_TIMEOUT:-500ms}"
      OTEL_SERVICE_NAME: profiles-block-builder
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}
      broker: {condition: service_healthy}

  profiles-querier:
    # --bootstrap is REQUIRED: the querier's hot WAL-tail consumer reads recent
    # (not-yet-compacted) profiles straight from the WAL. Without it the tail
    # falls back to 127.0.0.1:9092, can't reach the broker, and dies -> the hot
    # store stays empty and the cold store only has whatever index existed at
    # startup, so the querier returns no profiles.
    <<: [*o11y-image, *querier-res]
    command: ["krabka-profiles", "--target=querier", "--listen=0.0.0.0:4040", "--object-store-url=s3://krabka-profiles", "--bootstrap=broker:9092"]
    environment:
      <<: [*s3-env, *otlp-env]
      KRABKA_PROFILES_INDEX_SNAPSHOT_MAX: "${KRABKA_PROFILES_INDEX_SNAPSHOT_MAX:-256MiB}"
      KRABKA_PROFILES_WAL_POLL_TIMEOUT: "${KRABKA_PROFILES_WAL_POLL_TIMEOUT:-500ms}"
      OTEL_SERVICE_NAME: profiles-querier
    ports: ["4040:4040"]
    # The hot WAL-tail consumer (--bootstrap) connects to the broker at startup;
    # without waiting for broker health it starts too early, the initial join fails,
    # and the hot store stays empty -> profiles (especially sparse ones like memory)
    # return nothing until the container is restarted. Wait for the broker.
    depends_on:
      rustfs-setup: {condition: service_completed_successfully}
      broker: {condition: service_healthy}

  # ---- COLLECTOR + GRAFANA ----
  alloy:
    image: mirror.gcr.io/grafana/alloy:v1.18.1
    <<: *alloy-res
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    ports: ["12345:12345"]
    depends_on:
      broker: {condition: service_healthy}

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    <<: *cadvisor-res
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=15s"
      - "--disable_metrics=app,cpuLoad,disk,oom_event,percpu,perf_event,pressure"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  grafana:
    image: mirror.gcr.io/grafana/grafana:13.2
    <<: *grafana-res
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: "flameGraph traceqlEditor"
      GF_PLUGINS_PREINSTALL_SYNC: "grafana-lokiexplore-app@2.1.5,grafana-pyroscope-app@2.0.7,grafana-exploretraces-app@2.0.4,grafana-metricsdrilldown-app@2.1.0"
      GF_PLUGINS_DISABLE_PLUGINS: "elasticsearch"
    ports: ["3000:3000"]
    volumes:
      - "./grafana/provisioning:/etc/grafana/provisioning:ro"
    depends_on:
      - metrics-querier
      - traces-querier
      - logs-querier
      - profiles-querier

  # ---- DEMO APP ----
  demo-produce:
    <<: [*krabka-image, *demo-res]
    command: ["observability-demo-app", "--role=produce"]
    environment:
      <<: [*otlp-env, *legacy-demo-env]
      OTEL_SERVICE_NAME: demo-produce
      KRABKA_DEMO_BOOTSTRAP: broker:9092
      KRABKA_DEMO_REGISTRY: http://schema-registry:8081
      KRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF: "${KRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF:-10ms}"
      KRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF: "${KRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF:-1s}"
      KRABKA_DEMO_ORDERS_PER_SEC: "${KRABKA_DEMO_ORDERS_PER_SEC:-50}"
    depends_on:
      topic-setup: {condition: service_completed_successfully}
      schema-registry: {condition: service_healthy}

  demo-stream:
    <<: [*krabka-image, *demo-res]
    command: ["observability-demo-app", "--role=stream"]
    environment:
      <<: [*otlp-env, *legacy-demo-env]
      OTEL_SERVICE_NAME: demo-stream
      KRABKA_DEMO_STREAMS_BROKER_DNS_TIMEOUT: "${KRABKA_DEMO_STREAMS_BROKER_DNS_TIMEOUT:-10s}"
      KRABKA_DEMO_STREAMS_FETCH_MIN: "${KRABKA_DEMO_STREAMS_FETCH_MIN:-1B}"
      KRABKA_DEMO_STREAMS_POLL_INTERVAL: "${KRABKA_DEMO_STREAMS_POLL_INTERVAL:-200ms}"
      KRABKA_DEMO_STREAMS_COMMIT_INTERVAL: "${KRABKA_DEMO_STREAMS_COMMIT_INTERVAL:-5s}"
      KRABKA_DEMO_STREAMS_REBALANCE_TIMEOUT: "${KRABKA_DEMO_STREAMS_REBALANCE_TIMEOUT:-30s}"
      KRABKA_DEMO_STREAMS_LEAVE_HEARTBEAT_TIMEOUT: "${KRABKA_DEMO_STREAMS_LEAVE_HEARTBEAT_TIMEOUT:-5s}"
      KRABKA_DEMO_STREAMS_JOIN_RETRY_BACKOFF: "${KRABKA_DEMO_STREAMS_JOIN_RETRY_BACKOFF:-200ms}"
      KRABKA_DEMO_STREAMS_INTERACTIVE_QUERY_QUEUE_CAPACITY: "${KRABKA_DEMO_STREAMS_INTERACTIVE_QUERY_QUEUE_CAPACITY:-64}"
      KRABKA_DEMO_STREAMS_STATE_STORE_CACHE_MAX: "${KRABKA_DEMO_STREAMS_STATE_STORE_CACHE_MAX:-10MiB}"
      KRABKA_DEMO_BOOTSTRAP: broker:9092
      KRABKA_DEMO_REGISTRY: http://schema-registry:8081
      KRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF: "${KRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF:-10ms}"
      KRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF: "${KRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF:-1s}"
    depends_on:
      topic-setup: {condition: service_completed_successfully}
      schema-registry: {condition: service_healthy}

  demo-consume:
    <<: [*krabka-image, *demo-res]
    command: ["observability-demo-app", "--role=consume"]
    environment:
      <<: [*otlp-env, *legacy-demo-env]
      OTEL_SERVICE_NAME: demo-consume
      KRABKA_DEMO_BOOTSTRAP: broker:9092
      KRABKA_DEMO_REGISTRY: http://schema-registry:8081
      KRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF: "${KRABKA_DEMO_SCHEMA_FETCH_RETRY_INITIAL_BACKOFF:-10ms}"
      KRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF: "${KRABKA_DEMO_SCHEMA_FETCH_RETRY_MAX_BACKOFF:-1s}"
      KRABKA_DEMO_CONSUMER_LEAVE_GROUP_TIMEOUT: "${KRABKA_DEMO_CONSUMER_LEAVE_GROUP_TIMEOUT:-5s}"
      KRABKA_DEMO_CONSUMER_SUBSCRIPTION_METADATA_REFRESH_INTERVAL: "${KRABKA_DEMO_CONSUMER_SUBSCRIPTION_METADATA_REFRESH_INTERVAL:-5s}"
      KRABKA_DEMO_CONSUMER_STARTUP_ATTEMPT_TIMEOUT: "${KRABKA_DEMO_CONSUMER_STARTUP_ATTEMPT_TIMEOUT:-90s}"
      KRABKA_DEMO_CONSUMER_STARTUP_DEADLINE: "${KRABKA_DEMO_CONSUMER_STARTUP_DEADLINE:-5m}"
      KRABKA_DEMO_CONSUMER_STARTUP_INITIAL_BACKOFF: "${KRABKA_DEMO_CONSUMER_STARTUP_INITIAL_BACKOFF:-500ms}"
      KRABKA_DEMO_CONSUMER_STARTUP_MAX_BACKOFF: "${KRABKA_DEMO_CONSUMER_STARTUP_MAX_BACKOFF:-5s}"
      KRABKA_DEMO_CONSUMER_COORDINATOR_RETRY_TIMEOUT: "${KRABKA_DEMO_CONSUMER_COORDINATOR_RETRY_TIMEOUT:-30s}"
      KRABKA_DEMO_CONSUMER_COORDINATOR_INITIAL_BACKOFF: "${KRABKA_DEMO_CONSUMER_COORDINATOR_INITIAL_BACKOFF:-100ms}"
      KRABKA_DEMO_CONSUMER_COORDINATOR_MAX_BACKOFF: "${KRABKA_DEMO_CONSUMER_COORDINATOR_MAX_BACKOFF:-1s}"
      KRABKA_DEMO_CONSUMER_FETCH_MIN: "${KRABKA_DEMO_CONSUMER_FETCH_MIN:-1B}"
      KRABKA_DEMO_CONSUMER_FETCH_MAX: "${KRABKA_DEMO_CONSUMER_FETCH_MAX:-50MiB}"
      KRABKA_DEMO_CONSUMER_FETCH_PARTITION_MAX: "${KRABKA_DEMO_CONSUMER_FETCH_PARTITION_MAX:-1MiB}"
      KRABKA_DEMO_CONSUMER_SESSION_TIMEOUT: "${KRABKA_DEMO_CONSUMER_SESSION_TIMEOUT:-45s}"
      KRABKA_DEMO_CONSUMER_REBALANCE_TIMEOUT: "${KRABKA_DEMO_CONSUMER_REBALANCE_TIMEOUT:-1m}"
      KRABKA_DEMO_CONSUMER_HEARTBEAT_INTERVAL: "${KRABKA_DEMO_CONSUMER_HEARTBEAT_INTERVAL:-3s}"
      KRABKA_DEMO_CONSUMER_REQUEST_TIMEOUT: "${KRABKA_DEMO_CONSUMER_REQUEST_TIMEOUT:-30s}"
      KRABKA_DEMO_CONSUMER_AUTO_OFFSET_RESET: "${KRABKA_DEMO_CONSUMER_AUTO_OFFSET_RESET:-latest}"
      KRABKA_DEMO_CONSUMER_ISOLATION_LEVEL: "${KRABKA_DEMO_CONSUMER_ISOLATION_LEVEL:-read-uncommitted}"
      KRABKA_DEMO_CONSUMER_ASSIGNOR: "${KRABKA_DEMO_CONSUMER_ASSIGNOR:-range}"
    depends_on:
      topic-setup: {condition: service_completed_successfully}
      # The traced consumer now deserialises Order via the registry (to enrich
      # its processing spans), so it must wait for schema-registry like the
      # producer/stream roles do.
      schema-registry: {condition: service_healthy}

  # ---- GRES (PostgreSQL-compatible SQL engine over the broker) ----
  # Single-node substrate mode: one compute that owns every range, with the
  # broker as its write-ahead log and a local cache for the read model. That is
  # deliberately the simplest topology that still produces the query waterfall
  # — session → statement → executor → WAL append. A multi-range cluster
  # additionally needs mTLS material between the computes
  # (--range-tls-cert/key/ca), which no repo tooling generates, so it is not
  # part of the demo; see README.md.

  # One-shot: write the `demo` tenant's registry record to `__gres_cfg.demo`.
  # gres refuses to start in substrate mode without it — the record carries the
  # tenant's range layout and its SCRAM verifier, so it is also what sets the
  # SQL password. Idempotent: `describe` succeeds once the record exists.
  gres-setup:
    image: ghcr.io/robot-head/crabka-demo:latest
    <<: *setup-res
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >
        crabka gres describe --bootstrap broker:9092 --name demo >/dev/null 2>&1 && exit 0; printf '%s' "${KRABKA_GRES_PASSWORD:-demo}" | crabka gres create-tenant --bootstrap broker:9092 --name demo --user demo --password-stdin
    depends_on:
      broker: {condition: service_healthy}

  gres:
    <<: [*krabka-image, *gres-res]
    command: ["crabka-gres", "--listen=0.0.0.0:5433", "--substrate-bootstrap=broker:9092", "--tenant=demo", "--cache-dir=/data"]
    environment:
      <<: *otlp-env
      OTEL_SERVICE_NAME: gres
      # Full sampling, unlike every other service here. The 0.05 in x-otlp-env
      # exists to damp the traces pipeline's self-observation feedback loop;
      # gres is a database, not a trace backend, so its spans never re-enter
      # their own ingest path and cannot amplify. Head-sampling a query
      # waterfall at 5% would drop 19 of every 20 traces the demo exists to
      # show.
      KRABKA_OTLP_SAMPLE_RATIO: "1.0"
      CRABKA_OTLP_SAMPLE_RATIO: "1.0"
      # Verbatim SQL (`db.query.text`) on statement spans. OFF by default: the
      # query text carries literals, so it is the one setting here that can
      # export personal data or secrets. Spans still carry db.query.summary
      # ("SELECT demo_orders") plus operation/collection/namespace either way.
      KRABKA_OTLP_SQL_TEXT: "${KRABKA_GRES_OTLP_SQL_TEXT:-false}"
    ports: ["5433:5433"]
    volumes: ["gres-cache:/data"]
    depends_on:
      broker: {condition: service_healthy}
      gres-setup: {condition: service_completed_successfully}
      # No healthcheck on purpose. gres has no admin/metrics port, so the only
      # probe available is a TCP connect — and every connect opens a pgwire
      # session, which is itself a `gres.session` span. A probe on a timer would
      # bury the workload's traces under empty single-span sessions in exactly
      # the view this service exists to demonstrate. gres-workload waits for
      # readiness by retrying `SELECT 1` instead.

  # A gres with no clients emits no spans. This runs a small SQL loop —
  # INSERT, aggregate, point SELECT, plus one query carrying a client-supplied
  # W3C traceparent — so `docker compose up` produces a trace waterfall without
  # anyone having to open psql. Set KRABKA_GRES_WORKLOAD_INTERVAL=0 to make it
  # spin as fast as gres will answer; raise it to quieten the demo.
  gres-workload:
    image: mirror.gcr.io/library/postgres:18-alpine
    <<: *demo-res
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/workload.sh"]
    environment:
      PGCONNECT_TIMEOUT: "5"
      PGPASSWORD: "${KRABKA_GRES_PASSWORD:-demo}"
      KRABKA_GRES_WORKLOAD_INTERVAL: "${KRABKA_GRES_WORKLOAD_INTERVAL:-5}"
      KRABKA_GRES_WORKLOAD_CONNINFO: "host=gres port=5433 user=demo dbname=demo"
    volumes: ["./gres/workload.sh:/workload.sh:ro"]
    depends_on:
      gres: {condition: service_started}

volumes:
  broker-data:
  rustfs-data:
  gres-cache:

name: image

on:
  pull_request:
    paths:
      - .github/workflows/image.yml
      - BUILD.bazel
      - MODULE.bazel
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - packaging/apko/**
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/krabka-io/krabka-o11y-demo

jobs:
  image:
    name: build · publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          df -h /
      - name: build delivery image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bazel build -c opt //packaging/apko:image_manifest_blob
      - name: build multi-platform release image
        if: startsWith(github.ref, 'refs/tags/')
        run: bazel build -c opt //packaging/apko:image_multiarch_index_blob
      - name: digest
        id: digest
        run: |
          target=image_manifest_blob
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            target=image_multiarch_index_blob
          fi
          manifest="$(bazel cquery -c opt //packaging/apko:${target} --output=files)"
          echo "digest=sha256:$(sha256sum "${manifest}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish delivery image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bazel run -c opt //packaging/apko:push -- --tag "sha-${GITHUB_SHA::12}"
      - name: publish multi-platform release image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          newest="$(git tag --list 'v*' | sort -V | tail -1)"
          tags=("${GITHUB_REF#refs/tags/}" "sha-${GITHUB_SHA::12}")
          if [ "${newest}" = "${GITHUB_REF#refs/tags/}" ]; then
            tags+=(latest)
          fi

          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${tag}")
          done
          bazel run -c opt //packaging/apko:push_multiarch -- "${arguments[@]}"

          for tag in "${tags[@]}"; do
            actual="$(docker buildx imagetools inspect "${IMAGE}:${tag}" |
              awk '$1 == "Digest:" { print $2; exit }')"
            test "${actual}" = "${EXPECTED_DIGEST}"
          done
      - name: attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

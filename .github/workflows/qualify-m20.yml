name: qualify-m20

on:
  pull_request:
    paths:
      - .github/workflows/qualify-m20.yml
      - demo/observability/**
  push:
    branches: [main]
    paths:
      - .github/workflows/qualify-m20.yml
      - demo/observability/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: start pinned stack
        working-directory: demo/observability
        run: |
          mkdir -p qualification-artifacts/run
          docker compose up -d --wait --wait-timeout 600 \
            grafana cadvisor \
            demo-produce demo-stream demo-consume \
            metrics-distributor metrics-compactor metrics-querier \
            traces-distributor traces-block-builder traces-metrics-generator traces-querier \
            logs-distributor logs-compactor logs-querier \
            profiles-distributor profiles-block-builder profiles-querier || {
              docker compose ps -a >qualification-artifacts/run/startup-ps.txt
              docker compose logs --no-color >qualification-artifacts/run/startup.log 2>&1
              exit 1
            }
      - name: qualify recovery
        working-directory: demo/observability
        env:
          KRABKA_QUALIFICATION_ARTIFACT_DIR: qualification-artifacts/run
          KRABKA_SMOKE_TARGETS: metrics logs traces cross-signal profiles demo-produce demo-stream demo-consume
        run: ./qualify-failover.sh
      - name: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20-observability-recovery
          path: demo/observability/qualification-artifacts/run/
          if-no-files-found: error
      - name: stop stack
        if: always()
        working-directory: demo/observability
        run: docker compose down -v

name: qualify retained-state upgrade

on:
  workflow_call:
    inputs:
      previous_demo_image:
        required: true
        type: string
      candidate_demo_image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      previous_demo_image:
        description: Immutable N-1 demo image
        required: true
        type: string
      candidate_demo_image:
        description: Immutable candidate demo image
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KRABKA_REVISION: ${{ github.sha }}
      PREVIOUS_IMAGE: ${{ inputs.previous_demo_image }}
      CANDIDATE_IMAGE: ${{ inputs.candidate_demo_image }}
      KRABKA_SMOKE_TIMEOUT_SECONDS: "600"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: require immutable inputs
        run: |
          [[ "${PREVIOUS_IMAGE}" =~ ^ghcr.io/krabka-io/krabka-o11y-demo@sha256:[0-9a-f]{64}$ ]]
          [[ "${CANDIDATE_IMAGE}" =~ ^ghcr.io/krabka-io/krabka-o11y-demo@sha256:[0-9a-f]{64}$ ]]
          test "${PREVIOUS_IMAGE}" != "${CANDIDATE_IMAGE}"
      - name: start N-1 and seed retained state
        working-directory: demo/observability
        env:
          KRABKA_DEMO_IMAGE: ${{ env.PREVIOUS_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p qualification-artifacts/upgrade
          docker compose down -v --remove-orphans
          docker compose up -d --wait --wait-timeout 600
          KRABKA_SMOKE_TARGETS="ready metrics logs traces cross-signal profiles gres" ./smoke.sh
          curl -fsS -H 'X-Scope-OrgID: demo' 'http://127.0.0.1:9090/api/v1/query?query=sum(krabka_demo_orders_processed_total)' >qualification-artifacts/upgrade/before.json
          docker compose stop
      - name: upgrade in place and verify continuity
        working-directory: demo/observability
        env:
          KRABKA_DEMO_IMAGE: ${{ env.CANDIDATE_IMAGE }}
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 600
          KRABKA_SMOKE_TARGETS="ready metrics logs traces cross-signal profiles gres" ./smoke.sh
          curl -fsS -H 'X-Scope-OrgID: demo' 'http://127.0.0.1:9090/api/v1/query?query=sum(krabka_demo_orders_processed_total)' >qualification-artifacts/upgrade/after.json
          before="$(jq -r '.data.result[0].value[1] // 0' qualification-artifacts/upgrade/before.json)"
          after="$(jq -r '.data.result[0].value[1] // 0' qualification-artifacts/upgrade/after.json)"
          awk -v before="${before}" -v after="${after}" 'BEGIN {exit !(after >= before)}'
          ./check-services.sh >qualification-artifacts/upgrade/services.txt
      - name: injected failure and rollback
        working-directory: demo/observability
        env:
          KRABKA_DEMO_IMAGE: ${{ env.PREVIOUS_IMAGE }}
        run: |
          set -euo pipefail
          broken="ghcr.io/krabka-io/krabka-o11y-demo@sha256:$(printf broken | sha256sum | cut -d' ' -f1)"
          KRABKA_DEMO_IMAGE="${broken}" docker compose up -d demo-produce >/dev/null 2>&1 && exit 1 || true
          docker compose up -d --wait --wait-timeout 600
          KRABKA_SMOKE_TARGETS="ready metrics logs traces cross-signal profiles gres" ./smoke.sh
          ./revision-report.sh qualification-artifacts/upgrade/rollback-revisions.txt
          find qualification-artifacts/upgrade -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum >qualification-artifacts/upgrade/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: retained-state-upgrade
          path: demo/observability/qualification-artifacts/upgrade/
          if-no-files-found: error
      - name: stop stack
        if: always()
        working-directory: demo/observability
        run: docker compose down -v --remove-orphans

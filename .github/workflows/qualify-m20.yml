name: qualify-m20

on:
  pull_request:
    paths:
      - .github/workflows/qualify-m20.yml
      - demo/observability/**
  push:
    branches: [main]
    paths:
      - .github/workflows/qualify-m20.yml
      - demo/observability/**
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRABKA_REVISION: ${{ github.sha }}
      # The long-running services that qualification starts, with the
      # long-running services they depend on. check-services.sh fails when one
      # of them has no container, exits, or restarts.
      KRABKA_SMOKE_SERVICES: >-
        broker rustfs alloy schema-registry grafana cadvisor demo-produce demo-stream demo-consume metrics-distributor metrics-block-builder metrics-compactor metrics-querier traces-distributor traces-block-builder traces-metrics-generator traces-querier logs-distributor logs-block-builder logs-querier profiles-distributor profiles-block-builder profiles-querier
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: verify immutable image provenance and architecture
        working-directory: demo/observability
        run: ./verify-images.sh
      - name: start pinned stack
        working-directory: demo/observability
        run: |
          mkdir -p qualification-artifacts/run
          read -r -a services <<<"$KRABKA_SMOKE_SERVICES"
          status=0
          docker compose up -d --wait --wait-timeout 600 "${services[@]}" || status=$?
          # `docker compose up --wait` can return 0 while a service restarts in
          # a loop. check-services.sh also checks exits and restart counts.
          ./check-services.sh >qualification-artifacts/run/startup-services.txt || status=1
          cat qualification-artifacts/run/startup-services.txt
          if [ "$status" -ne 0 ]; then
            docker compose ps -a >qualification-artifacts/run/startup-ps.txt
            docker compose logs --no-color >qualification-artifacts/run/startup.log 2>&1
            exit 1
          fi
      - name: qualify recovery
        working-directory: demo/observability
        env:
          KRABKA_QUALIFICATION_ARTIFACT_DIR: qualification-artifacts/run
          KRABKA_SMOKE_TARGETS: ready metrics logs traces cross-signal profiles gres demo-produce demo-stream demo-consume
          # On a hosted runner, the first cross-signal trace can arrive more
          # than 300 s after a cold start (run 34858123239).
          KRABKA_SMOKE_TIMEOUT_SECONDS: "600"
        run: ./qualify-failover.sh
      - name: second cold start
        working-directory: demo/observability
        run: |
          set -euo pipefail
          docker compose down -v --remove-orphans
          docker compose up -d --wait --wait-timeout 600
          KRABKA_SMOKE_TARGETS="ready metrics logs traces cross-signal profiles gres demo-produce demo-stream demo-consume" ./smoke.sh
          ./check-services.sh >qualification-artifacts/run/second-cold-start.txt
          ./revision-report.sh qualification-artifacts/run/revisions.txt
      - name: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m20-observability-recovery
          path: demo/observability/qualification-artifacts/run/
          if-no-files-found: error
      - name: stop stack
        if: always()
        working-directory: demo/observability
        run: docker compose down -v
